[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shai-hulud-package-auditor"
version = "0.1.0"
description = "FastAPI service for scanning npm manifests and comparing them against a watchlist."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cyberint" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.23,<1",
  "pydantic>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<8"]

[project.scripts]
shai-hulud-api = "shai_hulud_auditor.main:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
